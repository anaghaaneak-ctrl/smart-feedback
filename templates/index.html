{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Share your feedback</h1>
  <p class="muted">Your message is analysed for sentiment automatically.</p>
  <form id="feedbackForm" novalidate>
    <div class="row">
      <label>Name<input name="name" required maxlength="120"></label>
      <label>Email<input name="email" type="email" required></label>
    </div>
    <div class="row">
      <label>Category
        <select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
      </label>
      <label>Product (optional)<select name="product_id" id="productSelect"><option value="">—</option></select></label>
    </div>
    <label>Rating</label>
    <div class="stars" id="stars">
      {% for i in range(1,6) %}<button type="button" data-v="{{ i }}">★</button>{% endfor %}
    </div>
    <input type="hidden" name="rating" id="rating">
    <label>Message<textarea name="message" rows="5" required minlength="5" maxlength="2000"></textarea></label>
    <div id="livePreview" class="muted small">Live sentiment: —</div>
    <p id="formErrors" class="error"></p>
    <button class="btn" type="submit">Submit feedback</button>
  </form>
  <div id="result" class="result hidden"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/submit.js') }}"></script>{% endblock %}
