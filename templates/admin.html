{% extends "base.html" %}
{% block title %}Admin · Smart Feedback{% endblock %}
{% block content %}
<h1>Store admin</h1>
<div class="grid two">
  <section class="card">
    <h3>Products & stock</h3>
    <form id="productForm" class="inline">
      <input name="name" placeholder="Name" required>
      <input name="price" type="number" step="0.01" min="0" placeholder="Price" required>
      <input name="stock" type="number" min="0" placeholder="Stock" required>
      <button class="btn">Add</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="prodBody"></tbody></table></div>
  </section>
  <section class="card">
    <h3>Orders (Placed → Shipped → Delivered)</h3>
    <form id="orderForm" class="inline">
      <input name="customer_name" placeholder="Customer" required>
      <select name="product_id" id="orderProduct"></select>
      <input name="quantity" type="number" min="1" value="1" required>
      <button class="btn">Place</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Customer</th><th>Product</th><th>Qty</th><th>Status</th><th></th></tr></thead><tbody id="orderBody"></tbody></table></div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/admin.js') }}"></script>{% endblock %}
